[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# Install Rust in CI via rustup instead of trusting runner images (macOS
# images lag stable; v0.6.0 release build failed with preinstalled 1.98 < MSRV)
rust-toolchain-version = "stable"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap (owner/repo) that the publish-homebrew job pushes the formula to
tap = "CaicoLeung/homebrew-aic"
# Publish jobs to run at announce time (homebrew pushes the formula to the tap)
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "arm-unknown-linux-gnueabihf", "x86_64-pc-windows-msvc"]
# Checksums to generate for each App
checksum = "sha256"
# Which phase dist should use to create the GitHub release
github-release = "host"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
unix-archive = ".tar.gz"
# aarch64-apple-darwin defaults to the macos-14 runner image, which is in a
# scheduled brownout ahead of its retirement on 2026-11-02 — Release runs
# during a brownout window get the queued aarch64 job cancelled with no logs
# (run 41107352927). Pin it to macos-15 (arm64) until dist's default table
# moves off macos-14. x86_64-apple-darwin already builds on macos-15-intel.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
