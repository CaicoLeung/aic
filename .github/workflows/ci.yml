name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 03:00 UTC — catches new RUSTSEC advisories against the
    # frozen Cargo.lock even when no PR is open. A failed scheduled run emails
    # the repo owner.
    - cron: '0 3 * * 1'

jobs:
  # fmt + clippy are OS-independent — run once on linux.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings

  # cargo test covers both #[test] unit tests and the src/e2e/ suite
  # (real-git tempdir tests with a stubbed LLM). Windows is a shipped
  # release target (see release.yml), so we matrix here to catch path /
  # CRLF / hook-shell-out regressions before they ship.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      # Bash release-helper unit tests — POSIX mktemp syntax, linux-only.
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/test_release.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --version
      - run: cargo deny check
