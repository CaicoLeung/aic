[package]
name = "aic"
version = "0.4.3"
edition = "2024"
rust-version = "1.88"
description = "AI-powered git commit message generator"
repository = "https://github.com/CaicoLeung/aic"
homepage = "https://github.com/CaicoLeung/aic"
keywords = ["git", "ai", "cli", "commit", "llm"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"

[profile.dist]
inherits = "release"
lto = "thin" # enable link-time optimization for a smaller binary
strip = true # strip symbols for a smaller, cleaner binary
codegen-units = 1 # reduce codegen units to improve compile times

[dependencies]
anyhow = "1.0.102"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
git2 = "0.21"
indicatif = "0.17"
console = "0.16"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
rig-core = "0.36"
schemars = "1"
similar = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
self_update = { version = "0.42", features = ["archive-tar", "archive-zip", "compression-flate2", "signatures"] }
clap_complete = "4.6.8"
clap_complete_nushell = "4.6.1"
carapace_spec_clap = "1.2.1"

[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"
