[package]
name = "aic"
version = "0.5.5"
edition = "2024"
rust-version = "1.88"
description = "AI-powered git commit message generator"
repository = "https://github.com/CaicoLeung/aic"
homepage = "https://github.com/CaicoLeung/aic"
keywords = ["git", "ai", "cli", "commit", "llm"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"

[profile.dist]
inherits = "release"
lto = "thin" # enable link-time optimization for a smaller binary
strip = true # strip symbols for a smaller, cleaner binary
codegen-units = 1 # reduce codegen units to improve compile times

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
git2 = "0.21"
indicatif = "0.18"
console = "0.16"
streamdown-parser = "0.1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
rig = "0.41"
schemars = "1"
similar = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
toml = "1"
# Archive features must cover BOTH release formats cargo-dist ships:
#   unix-archive = ".tar.gz"  -> compression-tar-gz (archive-tar + flate2 + zipsign verify-tar)
#   windows        = ".zip"   -> archive-zip + compression-zip-deflate (zipsign verify-zip)
# Dropping compression-tar-gz compiles out the Tar extraction arm in
# self_update::extract_into, so `aic update` on a shell-installed Unix binary
# would download the .tar.gz and fail to extract it. See dist-workspace.toml
# and docs/adr/0002-signed-self-update.md.
self_update = { version = "1.0.0-rc.6", features = ["signatures", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }
clap_complete = "4.6.8"
clap_complete_nushell = "4.6.1"
edit = "0.1"
libc = "0.2"
inquire = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
parking_lot = "0.12"
temp-env = "0.3"
tempfile = "3"
